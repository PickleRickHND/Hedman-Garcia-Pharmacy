# PRs semanales agrupados que se revisan y mergean a mano: el repo no tiene
# CI que los valide. El cooldown espera 7 días desde cada release antes de
# proponerla, como protección contra paquetes comprometidos.
version: 2
updates:
  - package-ecosystem: composer
    directory: /pharmacy-app
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Tegucigalpa
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directories:
      - /pharmacy-app
      - /pharmacy-frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Tegucigalpa
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
